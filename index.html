<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARGIN & GST CALCULATOR</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f2f5; }

    /* Top Navigation Header */
    header {
      background-color: #1a2332;
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header-btns {
      display: flex;
      gap: 10px;
    }
    .btn-copy {
      background-color: #3b5998;
      color: white;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-reset {
      background-color: #e53935;
      color: white;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Table Wrapper & Styling */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid rgba(0,0,0,0.15);
      padding: 6px 2px;
      height: 40px;
      vertical-align: middle;
    }

    /* Column Color Themes */
    .col-num { width: 35px; background-color: #ffffff; font-weight: bold; }
    .col-price { background-color: #4285f4; color: white; }
    .col-qty { background-color: #2ecc71; color: white; }
    .col-disc { background-color: #00bcd4; color: white; }
    .col-discprice { background-color: #16a085; color: white; }
    .col-gst { background-color: #27ae60; color: white; }
    .col-margin { background-color: #9b59b6; color: white; }
    .col-total { background-color: #f1c40f; color: #222; font-weight: bold; }
    .col-del { width: 35px; background-color: #ffffff; }

    /* Header styling */
    th span { display: block; font-size: 0.7rem; font-weight: normal; opacity: 0.9; }

    /* Inputs and Selects inside table */
    input[type="number"], select {
      width: 95%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: inherit;
      outline: none;
    }

    /* GST Dropdown Custom Style */
    select.gst-mode {
      cursor: pointer;
      font-size: 0.85rem;
    }
    select.gst-mode option {
      color: #333;
      background: #fff;
    }

    /* Delete Button */
    .btn-del {
      background: transparent;
      border: none;
      color: #888;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-del:hover { color: #e53935; }

    /* Bottom Total Row */
    tfoot td {
      font-weight: bold;
      font-size: 0.95rem;
      border-top: 2px solid #333;
    }
    tfoot .col-num { background-color: #333; color: white; }
  </style>
</head>
<body>

  <header>
    <div class="title">MARGIN & GST CALCULATOR</div>
    <div class="header-btns">
      <button class="btn-copy" onclick="copyTableData()">COPY</button>
      <button class="btn-reset" onclick="resetTable()">RESET</button>
    </div>
  </header>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-num">#</th>
          <th class="col-price">A<br><span>PRICE</span></th>
          <th class="col-qty">QTY<br><span>COUNT</span></th>
          <th class="col-disc">Z<br><span>DISC %</span></th>
          <th class="col-discprice">X<br><span>DISC PRICE</span></th>
          <th class="col-gst">GST MODE<br><span>PRICE+GST</span></th>
          <th class="col-margin">B<br><span>MARGIN</span></th>
          <th class="col-total">C<br><span>TOTAL</span></th>
          <th class="col-del">DEL</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot>
        <tr>
          <td class="col-num">TOT</td>
          <td class="col-price" id="totPrice">0</td>
          <td class="col-qty" id="totQty">0</td>
          <td class="col-disc">-</td>
          <td class="col-discprice" id="totDiscPrice">0.00</td>
          <td class="col-gst" id="totGstMode">0.00</td>
          <td class="col-margin" id="totMargin">0</td>
          <td class="col-total" id="totFinal">0.00</td>
          <td class="col-del"></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    const TOTAL_ROWS = 12;

    // Build default 12 rows
    function initTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      for (let i = 1; i <= TOTAL_ROWS; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-num row-num">${i}</td>
          <td class="col-price">
            <input type="number" class="price" value="0" min="0" step="any" onfocus="this.select()" oninput="calculate()">
          </td>
          <td class="col-qty">
            <input type="number" class="qty" value="1" min="1" step="any" onfocus="this.select()" oninput="calculate()">
          </td>
          <td class="col-disc">
            <input type="number" class="disc" value="0" min="0" max="100" step="any" onfocus="this.select()" oninput="calculate()">
          </td>
          <td class="col-discprice disc-price">0.00</td>
          <td class="col-gst">
            <select class="gst-mode" onchange="calculate()">
              <option value="0">+0%</option>
              <option value="18" selected>+18%</option>
            </select>
            <div class="gst-val" style="font-size: 0.75rem;">0.00</div>
          </td>
          <td class="col-margin">
            <input type="number" class="margin" value="0" step="any" onfocus="this.select()" oninput="calculate()">
          </td>
          <td class="col-total row-total">0.00</td>
          <td class="col-del"><button class="btn-del" onclick="clearRow(this)">✕</button></td>
        `;
        tbody.appendChild(tr);
      }
      calculate();
    }

    // Dynamic Calculation Logic
    function calculate() {
      const rows = document.querySelectorAll('#tableBody tr');
      let sumPrice = 0;
      let sumQty = 0;
      let sumDiscPrice = 0;
      let sumPricePlusGst = 0;
      let sumMargin = 0;
      let sumGrandTotal = 0;

      rows.forEach(row => {
        const price = parseFloat(row.querySelector('.price').value) || 0;
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const discPct = parseFloat(row.querySelector('.disc').value) || 0;
        const gstRate = parseFloat(row.querySelector('.gst-mode').value) || 0;
        const marginAmt = parseFloat(row.querySelector('.margin').value) || 0;

        // 1. Discounted Unit Price
        const discPrice = price - (price * (discPct / 100));
        row.querySelector('.disc-price').innerText = discPrice.toFixed(2);

        // 2. GST calculated on Base Price
        const gstAmountUnit = discPrice * (gstRate / 100);
        
        // 3. PRICE + GST (Disc Price + GST Amount) * QTY
        const pricePlusGstTotal = (discPrice + gstAmountUnit) * qty;
        row.querySelector('.gst-val').innerText = pricePlusGstTotal.toFixed(2);

        // 4. Row Total = PRICE+GST + (Margin * QTY)
        const rowTotal = pricePlusGstTotal + (marginAmt * qty);
        row.querySelector('.row-total').innerText = rowTotal.toFixed(2);

        // Accumulate Totals for active rows
        if (price > 0) {
          sumPrice += price * qty;
          sumQty += qty;
          sumDiscPrice += discPrice * qty;
          sumPricePlusGst += pricePlusGstTotal;
          sumMargin += marginAmt * qty;
          sumGrandTotal += rowTotal;
        }
      });

      // Update Bottom Footer Totals
      document.getElementById('totPrice').innerText = sumPrice.toFixed(0);
      document.getElementById('totQty').innerText = sumQty;
      document.getElementById('totDiscPrice').innerText = sumDiscPrice.toFixed(2);
      document.getElementById('totGstMode').innerText = sumPricePlusGst.toFixed(2);
      document.getElementById('totMargin').innerText = sumMargin.toFixed(0);
      document.getElementById('totFinal').innerText = sumGrandTotal.toFixed(2);
    }

    // Clear single row value on 'X' press
    function clearRow(btn) {
      const tr = btn.closest('tr');
      tr.querySelector('.price').value = 0;
      tr.querySelector('.qty').value = 1;
      tr.querySelector('.disc').value = 0;
      tr.querySelector('.margin').value = 0;
      tr.querySelector('.gst-mode').value = 18;
      calculate();
    }

    // Reset Table
    function resetTable() {
      initTable();
    }

    // Copy Summary to Clipboard
    function copyTableData() {
      const totFinal = document.getElementById('totFinal').innerText;
      const totQty = document.getElementById('totQty').innerText;
      const totMargin = document.getElementById('totMargin').innerText;
      const text = `Total Items: ${totQty}\nTotal Margin: ₹${totMargin}\nGrand Total: ₹${totFinal}`;
      navigator.clipboard.writeText(text).then(() => {
        alert("Summary Copied to Clipboard:\n" + text);
      });
    }

    window.onload = initTable;
  </script>

</body>
</html>
